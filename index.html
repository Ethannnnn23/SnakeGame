<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Face Snake</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 10px;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 392px;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    color: #eee;
    font-size: 16px;
    font-weight: 600;
    padding: 0 4px;
    box-sizing: border-box;
  }
  #canvasWrap {
    position: relative;
    width: 100%;
    max-width: 392px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    background: #0f3d1f;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    touch-action: none;
  }
  #msg {
    color: #ffd166;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  #overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    text-align: center;
    background: rgba(0,0,0,0.8);
    padding: 20px 28px;
    border-radius: 14px;
    display: none;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    width: 80%;
    max-width: 260px;
  }
  #overlay button {
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #06d6a0;
    color: #063;
    font-weight: bold;
    cursor: pointer;
  }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, minmax(44px, 60px));
    grid-template-rows: repeat(3, minmax(44px, 60px));
    gap: 6px;
    margin-top: 2px;
  }
  #dpad button {
    font-size: 20px;
    border-radius: 8px;
    border: none;
    background: #333f5c;
    color: white;
    opacity: 0.9;
    touch-action: manipulation;
  }
  #dpad button:active { background: #06d6a0; }

  @media (max-height: 700px) {
    #dpad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
    #wrap { gap: 5px; }
    #msg { font-size: 11px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>Score: <span id="score">0</span></span>
    <span>Best: <span id="best">0</span></span>
  </div>
  <div id="canvasWrap">
    <canvas id="game" width="392" height="392"></canvas>
    <div id="overlay">
      <div id="overlayTitle" style="font-size:22px;font-weight:bold;">Game Over</div>
      <div id="overlayScore"></div>
      <button id="restartBtn">Play Again</button>
    </div>
  </div>
  <div id="msg">Use arrow keys / swipe / buttons to move</div>
  <div id="dpad">
    <div></div><button id="up">^</button><div></div>
    <button id="left"><</button><div></div><button id="right">></button>
    <div></div><button id="down">v</button><div></div>
  </div>
</div>

let snake, dir, nextDir, food, score, best, gameOver, loopId;
best = parseInt(localStorage && localStorage.getItem ? (localStorage.getItem('faceSnakeBest') || '0') : '0') || 0;
document.getElementById('best').textContent = best;

function resetGame() {
  snake = [
    {x: 8, y: 10},
    {x: 7, y: 10},
    {x: 6, y: 10}
  ];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  placeFood();
  document.getElementById('score').textContent = score;
  document.getElementById('overlay').style.display = 'none';
}

function placeFood() {
  let valid = false;
  while (!valid) {
    food = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    valid = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function drawRoundedTile(x, y, color) {
  const px = x * gridSize;
  const py = y * gridSize;
  ctx.fillStyle = color;
  const r = 5;
  ctx.beginPath();
  ctx.moveTo(px + r, py);
  ctx.arcTo(px + gridSize, py, px + gridSize, py + gridSize, r);
  ctx.arcTo(px + gridSize, py + gridSize, px, py + gridSize, r);
  ctx.arcTo(px, py + gridSize, px, py, r);
  ctx.arcTo(px, py, px + gridSize, py, r);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // subtle grid background
  ctx.fillStyle = '#0f3d1f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.save();
  ctx.fillStyle = '#ef476f';
  const fx = food.x * gridSize + gridSize/2;
  const fy = food.y * gridSize + gridSize/2;
  ctx.beginPath();
  ctx.arc(fx, fy, gridSize/2 - 3, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // body
  for (let i = 1; i < snake.length; i++) {
    const shade = i % 2 === 0 ? '#06d6a0' : '#05b088';
    drawRoundedTile(snake[i].x, snake[i].y, shade);
  }

  // head = face image
  const head = snake[0];
  const hx = head.x * gridSize;
  const hy = head.y * gridSize;
  ctx.save();
  ctx.beginPath();
  ctx.arc(hx + gridSize/2, hy + gridSize/2, gridSize/2 + 1, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();
  if (faceImg.complete && faceImg.naturalWidth > 0) {
    ctx.drawImage(faceImg, hx - 2, hy - 2, gridSize + 4, gridSize + 4);
  } else {
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(hx, hy, gridSize, gridSize);
  }
  ctx.restore();
}

function update() {
  if (gameOver) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
}

function endGame() {
  gameOver = true;
  if (score > best) {
    best = score;
    document.getElementById('best').textContent = best;
    try { localStorage.setItem('faceSnakeBest', best); } catch(e) {}
  }
  document.getElementById('overlayScore').textContent = 'Score: ' + score;
  document.getElementById('overlay').style.display = 'flex';
}

function gameLoop() {
  update();
  draw();
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return; // no reverse
  nextDir = {x, y};
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
    case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
  }
});

document.getElementById('up').onclick = () => setDir(0, -1);
document.getElementById('down').onclick = () => setDir(0, 1);
document.getElementById('left').onclick = () => setDir(-1, 0);
document.getElementById('right').onclick = () => setDir(1, 0);
document.getElementById('restartBtn').onclick = () => resetGame();

let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: true});
canvas.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDir(dx > 0 ? 1 : -1, 0);
  } else {
    setDir(0, dy > 0 ? 1 : -1);
  }
}, {passive: true});

resetGame();
draw();
loopId = setInterval(gameLoop, 130);
</script>
